name: sync-and-deploy

on:
  # Refresh every 3 hours so new parent submissions trickle in.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  # contents: write so the keepalive step below can push its empty commit.
  contents: write
  pages: write
  id-token: write

# Cancel any in-flight run when a new one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the keepalive push isn't a shallow update.
          fetch-depth: 0

      # GitHub disables cron workflows after 60 days with no repo activity,
      # which silently froze the kiosk roster for 10 days in Aug 2026. Push an
      # empty commit as that window closes to keep the schedule alive. Runs
      # before the sync so a sync failure can't also cost us the keepalive.
      # Pushes made with GITHUB_TOKEN don't trigger workflows, so the `push:`
      # trigger above won't loop.
      - name: Keepalive
        if: github.event_name == 'schedule'
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 50 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'chore: keepalive (prevent scheduled workflow auto-disable)'
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync roster + photos
        run: node tools/sync.mjs
        env:
          # Set these in repo Settings → Secrets and variables → Actions.
          # Without them, sync falls back to sample data.
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SUBMISSIONS_SHEET_ID: ${{ secrets.SUBMISSIONS_SHEET_ID }}
          ROSTER_SHEET_ID: ${{ secrets.ROSTER_SHEET_ID }}
          # Optional: responses sheet of the prospective-missionary form.
          # Unset = no prospective cards and no stake tour.
          PROSPECTIVE_SHEET_ID: ${{ secrets.PROSPECTIVE_SHEET_ID }}
          LEADER_ORG_CHART_ID: ${{ secrets.LEADER_ORG_CHART_ID }}
          LEADER_PROFILES_SHEET_ID: ${{ secrets.LEADER_PROFILES_SHEET_ID }}

      - name: Build web
        run: npm run build
        env:
          # Subpath for project Pages (naugsco.github.io/called-to-serve/).
          BASE_URL: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run so we don't need a manual
          # repo Settings → Pages toggle.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
